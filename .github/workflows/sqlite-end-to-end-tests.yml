name: SQLite End to End Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sqlite-end-to-end-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm i

      - name: Build CLI tool
        run: pnpm build

      - name: Install Playwright's dependencies
        working-directory: src/packages/end-to-end
        run: pnpm playwright install --with-deps chromium

      - name: Init and Import SQLite Chinook Database
        working-directory: src/packages/end-to-end
        run: |
          pnpm import-database-sqlite

      - name: Start and Test GW instance
        working-directory: src/packages/end-to-end
        timeout-minutes: 7
        run: |
          pnpm start-server &
          sleep 5 &&
          pnpm test-sqlite &&
          pnpm test-ui-sqlite &&
          killall node

      - name: Add Native Module
        # Expected to fail: the backend bundles for Lambda, where a .node binary cannot go, so the
        # builder refuses to bundle a package with native code.
        #
        # The import is the part that matters. That guard is an esbuild resolve hook, so it only
        # sees a package something actually imports -- installing one and never importing it builds
        # cleanly, which is the state this step silently fell into once the SQL adapter replaced
        # MikroORM's native sqlite driver with a wasm one and nothing pulled sqlite3 in any more.
        working-directory: src/packages/end-to-end/app
        id: native-module
        run: |
          pnpm add sqlite3
          echo "import 'sqlite3';" >> src/backend/index.ts
          pnpm build
        continue-on-error: true

      - name: Check Native Module Failures
        # If the native module build succeeds, we want to fail the build as the native module is not supported
        if: steps.native-module.outcome == 'success'
        run: exit 1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: src/packages/end-to-end/playwright-report/
          retention-days: 30

        env:
          CI: true
