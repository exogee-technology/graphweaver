# What the web portal is allowed to send.
#
# Users reach the portal with a magic link, and can manage their tasks in full.

query WebTaskList($filter: TasksListFilter, $pagination: TasksPaginationInput) {
	tasks(filter: $filter, pagination: $pagination) {
		...WebTaskFields
	}
}

mutation WebCompleteTask($input: TaskUpdateInput!) {
	updateTask(input: $input) {
		...WebTaskFields
	}
}

fragment WebTaskFields on Task {
	id
	description
	isCompleted
	tags {
		id
		name
	}
}
