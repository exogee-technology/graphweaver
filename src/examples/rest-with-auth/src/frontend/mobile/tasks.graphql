# What the mobile app is allowed to send.
#
# Deliberately a smaller surface than the web portal: the app only lists tasks, and has no
# mutation at all. Even a user holding a perfectly valid web session cannot run WebCompleteTask
# through the mobile app, because the allow list is chosen per request rather than per user.

query MobileTaskList($pagination: TasksPaginationInput) {
	tasks(pagination: $pagination) {
		id
		description
		isCompleted
	}
}
